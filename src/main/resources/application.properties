spring.application.name=glottia-backend

# PostgreSQL Connection - LOCAL / RENDER
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/glottia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}
app.frontend-url=${FRONTEND_URL:https://glottia-frontend.onrender.com}

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET:Z2xvdHRpYS1kZXYtanN3LXNlY3JldC0zMi1ieXRlcy0xMjM0NTY=}
jwt.expiration=86400000
